  # are excluded in transform(). ~79.3k flows; opt-in so it stays out of `run --all`.
  # One content-named file per compartment (rule 2026-08-07: payload files are
  # named by content, never by source); emit_filename is the compartment slug the
  # source filters on. air/water exceed the vocab 3 MB guard — shard the staged
  # file with scripts/shard_collection.py (stem = the slug, giving air-01.parquet …)
