  # are excluded in transform(). ~79.3k flows; opt-in so it stays out of `run --all`.
  # Named ef31-*: the emitted parquet is the generic EF 3.1 list, not Agribalyse data
  # (sentier_vocab shards live at data/elementary-flows/ef31-0N.parquet).
  - name: ef31-elementary-flows
    module: sentier_importers.sources.agribalyse.flows
    target: sentier_vocab
    category: elementary-flows
    fetch:
      url: "file:///home/laurenz/dds/dds-agribalyse/source/harmonised-flows-simple.json.gz"
