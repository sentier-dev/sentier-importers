# The human-readable list of all data sources. Read top-to-bottom; one block per
# source. Adding a source = new folder under sources/ + one block here.
#
# Vocab (sentier_vocab) sources additionally declare a `collection` block — the
# framework wraps the transformed rows into a single `{scheme, <items_key>: [...]}`
# Collection object and validates it against the tree-root `class`. A `dedup` block
# tunes the deterministic in-repo dedup (see core/dedup.py). Both are optional;
# omitting them yields the legacy flat-list behavior used by bulk targets. Example:
#
#   - name: agribalyse-products
#     module: sentier_importers.sources.agribalyse.source
#     target: sentier_vocab
#     category: products
#     fetch: { url: "https://…/agribalyse.xlsx", format: xlsx }
#     output_format: yaml
#     collection:
#       class: ProductCollection                      # tree-root class to validate against
#       items_key: products                           # plural slot holding the items
#       scheme: https://vocab.sentier.dev/products/    # required ConceptScheme IRI
#       schema_file: product                          # schema file id (schemas/product.yaml)
#     validate_against: Product                        # item class — documentation / per-item
#     dedup:
#       on_existing: skip                              # skip | error | overwrite (default skip)
#       check_existing: true                           # Layer B on/off (default true)
#     enabled: true
sources:
  # sentier-mappings: Agribalyse 3.2 → EF 3.1 biosphere crosswalk (randonneur package).
  # Non-ecoinvent, hand-authored entries only (curated + LLM-reviewed); see
  # docs/specs/2026-07-10-sentier-mappings-target.md. Emits data/<category>/biosphere.json.
  - name: biosphere
    module: sentier_importers.sources.agribalyse.mappings_biosphere
    target: sentier_mappings
    category: 02-agribalyse-3.2__ef-3.1
    fetch:
      url: "https://github.com/sentier-dev/sentier-importers/releases/download/agribalyse-flows-v1/mappings_biosphere.parquet"
      format: parquet
    output_format: json
    package:
      name: agribalyse-3.2__ef-3.1-biosphere
      version: 0.1.0
      verb: replace
    enabled: false

  - name: example-csv
    module: sentier_importers.sources.example_csv.source
    target: sentier_inventory
    category: example
    fetch:
      url: "bundled://example.csv"  # overridden by the plugin's fetch(); see source.py
      format: csv
    output_format: json
    validate_against: null
    enabled: true

  # FoodEx2, imported from EFSA's PRIMARY source: the MTX catalogue published at
  # openefsa/efsa-catalogues as MTX.ecf (a ZIP wrapping MTX.xml). Pinned to a specific
  # commit (catalogue v17.1) so re-imports are deliberate; the pin is recorded in
  # foodex2/provenance.py (CATALOGUE_VERSION / CATALOGUE_COMMIT / MTX_URL). This replaces
  # the former third-party esfc-glossary pull (AGPL, opaque AI transforms).
  # FoodEx2 routes across three categories by `termType` (see foodex2/source.py).
  # All three blocks fetch the same cached ~3.8MB .ecf and filter to their own slice; opt-in
  # (enabled: false) so the ~31k-term import stays out of the blanket `run --all`.
  - name: foodex2-products            # Commodities + grouping nodes, termType r/d/s/c/g (~5.9k)
    module: sentier_importers.sources.foodex2.source
    target: sentier_vocab
    category: products
    fetch:
      url: "https://raw.githubusercontent.com/openefsa/efsa-catalogues/242ead56e40a29002a66d63fc64c6a497151af4b/ecf_catalogues/MTX.ecf"
      format: ecf
    output_format: parquet
    collection:
      class: ProductCollection
      items_key: products
      scheme: https://vocab.sentier.dev/products/
      schema_file: product
    validate_against: Product
    dedup:
      on_existing: skip
      check_existing: true                           # dedup against existing products
    enabled: false

  - name: foodex2-organisms           # Biological source taxa, termType n (~23.9k)
    module: sentier_importers.sources.foodex2.source
    target: sentier_vocab
    category: organisms
    fetch:
      url: "https://raw.githubusercontent.com/openefsa/efsa-catalogues/242ead56e40a29002a66d63fc64c6a497151af4b/ecf_catalogues/MTX.ecf"
      format: ecf
    output_format: parquet
    collection:
      class: OrganismCollection
      items_key: organisms
      scheme: https://vocab.sentier.dev/organisms/
      schema_file: organism
    validate_against: Organism
    dedup:
      on_existing: skip
      check_existing: false                          # new category; no existing data dir
    enabled: false

  - name: foodex2-qualifiers          # Facet descriptors, termType f (~1.9k)
    module: sentier_importers.sources.foodex2.source
    target: sentier_vocab
    category: qualifiers
    fetch:
      url: "https://raw.githubusercontent.com/openefsa/efsa-catalogues/242ead56e40a29002a66d63fc64c6a497151af4b/ecf_catalogues/MTX.ecf"
      format: ecf
    output_format: parquet
    collection:
      class: QualifierCollection
      items_key: qualifiers
      scheme: https://vocab.sentier.dev/qualifiers/
      schema_file: qualifier
    validate_against: Qualifier
    dedup:
      on_existing: skip
      check_existing: false                          # new category; no existing data dir
    enabled: false

  # Bibliographic provenance for FoodEx2 — one Source record that every imported
  # product links to via its `source` slot. Static metadata, no fetch input.
  - name: foodex2-source
    module: sentier_importers.sources.foodex2.provenance
    target: sentier_vocab
    category: sources
    fetch:
      url: "static://foodex2-source"  # unused: the plugin's fetch() returns no input
      format: json
    output_format: yaml
    collection:
      class: SourceCollection
      items_key: sources
      scheme: https://vocab.sentier.dev/sources/
      schema_file: source
    validate_against: Source
    dedup:
      on_existing: skip
      check_existing: false                          # single static record; no Layer B
    enabled: false

  # Agribalyse adapter — CIQUAL products (ADEME Etalab open data). Nomenclature only
  # (codes, French names, food-group hierarchy); NO impact scores, NO LCI amounts.
  # ~2.5k terms (11 groups + 61 subgroups + ~2.45k products). Opt-in.
  - name: agribalyse-products
    module: sentier_importers.sources.agribalyse.products
    target: sentier_vocab
    category: products
    fetch:
      url: "https://github.com/sentier-dev/sentier-importers/releases/download/agribalyse-flows-v1/AGRIBALYSE3.2_reference_synthese_raw.parquet"
      format: parquet
    output_format: parquet
    collection:
      class: ProductCollection
      items_key: products
      scheme: https://vocab.sentier.dev/products/
      schema_file: product
    validate_against: Product
    dedup:
      on_existing: skip
      check_existing: true                           # dedup against existing products (incl. FoodEx2)
    enabled: false

  # Bibliographic provenance for Agribalyse 3.2 — the Source every product links to.
  - name: agribalyse-source
    module: sentier_importers.sources.agribalyse.agribalyse_provenance
    target: sentier_vocab
    category: sources
    fetch:
      url: "static://agribalyse-source"  # unused: the plugin's fetch() returns no input
      format: json
    output_format: yaml
    collection:
      class: SourceCollection
      items_key: sources
      scheme: https://vocab.sentier.dev/sources/
      schema_file: source
    validate_against: Source
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  # EF 3.1 LCIA layer (JRC public). Three slices over the same characterization-factor
  # parquet: one method, its 25 impact categories, and the CF values (re-keyed to the
  # agribalyse flow IRIs — no ecoinvent). CF values are JRC-public and uncapped.
  - name: methods
    module: sentier_importers.sources.agribalyse.methods
    target: sentier_vocab
    category: lcia-methods
    fetch:
      url: "https://github.com/sentier-dev/sentier-importers/releases/download/agribalyse-flows-v1/EF-LCIAMethod-CF-EF-v3.1.parquet"
      format: parquet
    output_format: yaml
    collection:
      class: LCIAMethodCollection
      items_key: lcia_methods
      scheme: https://vocab.sentier.dev/lcia-methods/
      schema_file: lcia-method
    validate_against: LCIAMethod
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  - name: impact_categories
    module: sentier_importers.sources.agribalyse.impact_categories
    target: sentier_vocab
    category: impact-categories
    fetch:
      url: "https://github.com/sentier-dev/sentier-importers/releases/download/agribalyse-flows-v1/EF-LCIAMethod-CF-EF-v3.1.parquet"
      format: parquet
    output_format: yaml
    collection:
      class: ImpactCategoryCollection
      items_key: impact_categories
      scheme: https://vocab.sentier.dev/impact-categories/
      schema_file: impact-category
    validate_against: ImpactCategory
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  - name: cfs
    module: sentier_importers.sources.agribalyse.cfs
    target: sentier_vocab
    category: characterization-factors
    fetch:
      url: "https://github.com/sentier-dev/sentier-importers/releases/download/agribalyse-flows-v1/EF-LCIAMethod-CF-EF-v3.1.parquet"
      format: parquet
    output_format: parquet
    collection:
      class: CharacterizationFactorCollection
      items_key: characterization_factors
      scheme: https://vocab.sentier.dev/characterization-factors/
      schema_file: characterization-factor
    validate_against: CharacterizationFactor
    dedup:
      on_existing: skip
      check_existing: false                          # new category; keeps first per (impact,flow)
    enabled: false

  # Agribalyse adapter — EF 3.1 harmonised elementary flows (license-free, JRC public).
  # Fetches the pinned release asset (see docs/plans/2026-07-10-agribalyse-elementary-flows-import.md
  # Task 0); nomenclature only, NO LCI amounts. Flows tagged "ecoinvent algorithm addition"
  # are excluded in transform(). ~79.3k flows; opt-in so it stays out of `run --all`.
  - name: agribalyse-elementary-flows
    module: sentier_importers.sources.agribalyse.flows
    target: sentier_vocab
    category: elementary-flows
    fetch:
      url: "https://github.com/sentier-dev/sentier-importers/releases/download/agribalyse-flows-v1/harmonised-flows-simple.json.gz"
      format: json-gz                                # unused: the plugin overrides parse() to gunzip
    output_format: parquet
    collection:
      class: ElementaryFlowCollection
      items_key: flows
      scheme: https://vocab.sentier.dev/flows/
      schema_file: elementary-flow
    validate_against: ElementaryFlow
    dedup:
      on_existing: skip                              # do not clobber curated flows/ENVO_* terms
      check_existing: true
    enabled: false

  # Bibliographic provenance for the EF 3.1 flow list — one Source record every flow
  # links to via its `source` slot. Static metadata, no fetch input.
  - name: agribalyse-ef31-source
    module: sentier_importers.sources.agribalyse.provenance
    target: sentier_vocab
    category: sources
    fetch:
      url: "static://agribalyse-ef31-source"  # unused: the plugin's fetch() returns no input
      format: json
    output_format: yaml
    collection:
      class: SourceCollection
      items_key: sources
      scheme: https://vocab.sentier.dev/sources/
      schema_file: source
    validate_against: Source
    dedup:
      on_existing: skip
      check_existing: false                          # single static record; no Layer B
    enabled: false
