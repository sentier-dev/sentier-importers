# The human-readable list of all data sources. Read top-to-bottom; one block per
# source. Adding a source = new folder under sources/ + one block here.
#
# sentier-vocab stores one source release as terms/<release>[-NN].parquet (every
# term, all types mixed) and relations/<release>.parquet (every edge). A vocab
# (sentier_vocab) source is one part of a release: `category` is the release, the
# identifier of its source term (https://vocab.sentier.dev/sources/<release>), and
# `term_type` is the value its rows get in the `type` column. The framework turns
# the literal slots of a row into `attributes` and the IRI-valued slots into
# relation rows, and checks both against sentier-vocab's schemas/term.yaml and
# schemas/relation.yaml. A release is delivered whole, never one source at a time:
#
#   sentier-importers run --release <release> [--deliver | --deliver-local ../sentier-vocab]
#
# A `dedup` block tunes the deterministic dedup (see core/dedup.py). Example:
#
#   - name: agribalyse-products
#     module: sentier_importers.sources.agribalyse.products
#     target: sentier_vocab
#     category: agribalyse-3.2                         # the source release
#     term_type: product                               # a type listed in term.yaml
#     fetch: { url: "https://…/agribalyse.xlsx", format: xlsx }
#     output_format: parquet
#     dedup:
#       on_existing: skip                              # skip | error (default skip): an IRI
#                                                      #   another release already delivers
#       check_existing: true                           # Layer B on/off (default true)
#     enabled: true
sources:
  # sentier-mappings: Agribalyse 3.2 → EF 3.1 biosphere crosswalk (randonneur package).
  # Non-ecoinvent, hand-authored entries only (curated + LLM-reviewed); see
  # docs/specs/2026-07-10-sentier-mappings-target.md. Emits data/<category>/biosphere.json.
  - name: biosphere
    module: sentier_importers.sources.agribalyse.mappings_biosphere
    target: sentier_mappings
    category: agribalyse-3.2__ef-3.1
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/registry/mappings_biosphere.parquet"
      format: parquet
    output_format: json
    package:
      name: agribalyse-3.2__ef-3.1-biosphere
      version: 0.1.0
      verb: replace
    enabled: false

  # sentier-mappings: ecoinvent biosphere → EF 3.1 elementary flows, the correspondences
  # sentier-vocab carried as exact_match until its term and relation layers (issue #34).
  # Upstream is Brightway's randonneur_data package (CC-BY-4.0, Chris Mutel with the UNEP
  # GLAD taskforce), pinned by commit. The ecoinvent side keeps the exchange UUID only; a
  # target without a sentier-vocab term says so in its comment. Emits biosphere.json.
  - name: ecoinvent-ef-biosphere
    module: sentier_importers.sources.randonneur_data.ecoinvent_ef_biosphere
    target: sentier_mappings
    category: ecoinvent-3.11-biosphere__ef-3.1
    emit_filename: biosphere
    fetch:
      url: "https://raw.githubusercontent.com/brightway-lca/randonneur_data/0c9693b7ae1946ace6846968f3890c4cf8e5fa72/randonneur_data/data/ecoinvent-3.11-biosphere-EF-3.1-biosphere.gz"
      format: json                                   # unused: the plugin overrides parse() to gunzip
    inputs:
      ef_vocab: "file://${SENTIER_DATA_ROOT}/sentier-vocab/terms"
    output_format: json
    package:
      name: ecoinvent-3.11-biosphere__ef-3.1-biosphere
      version: 0.1.0
      verb: replace
    enabled: false

  - name: example-csv
    module: sentier_importers.sources.example_csv.source
    target: sentier_inventory
    category: example
    fetch:
      url: "bundled://example.csv"  # overridden by the plugin's fetch(); see source.py
      format: csv
    output_format: json
    enabled: true

  # The terms Sentier.dev curates itself (units QUDT lacks, unit groups, flow properties,
  # model terms, sources, contacts, pilot terms), authored in sources/sentier_core/data/seed.yaml
  # and delivered as the release sentier-core: `run --release sentier-core`. The seed
  # mixes term types, so each row names its own (`term_type: per-row`).
  - name: sentier-core
    module: sentier_importers.sources.sentier_core.source
    target: sentier_vocab
    category: sentier-core
    term_type: per-row
    fetch:
      url: "bundled://sentier_core/data/seed.yaml"  # unused: the plugin reads the bundled seed
      format: yaml
    output_format: parquet
    dedup:
      on_existing: error                             # a curated IRI must not exist elsewhere
      check_existing: true
    enabled: false

  # FoodEx2, imported from EFSA's PRIMARY source: the MTX catalogue published at
  # openefsa/efsa-catalogues as MTX.ecf (a ZIP wrapping MTX.xml). Pinned to a specific
  # commit (catalogue v17.1) so re-imports are deliberate; the pin is recorded in
  # foodex2/provenance.py (CATALOGUE_VERSION / CATALOGUE_COMMIT / MTX_URL). This replaces
  # the former third-party esfc-glossary pull (AGPL, opaque AI transforms).
  # FoodEx2 routes across three term types by `termType` (see foodex2/source.py).
  # All three blocks fetch the same cached ~3.8MB .ecf and filter to their own slice; opt-in
  # (enabled: false) so the ~31k-term import stays out of the blanket `run --all`.
  # Release: `run --release foodex2` (the three slices plus the source term).
  - name: foodex2-products            # Commodities + grouping nodes, termType r/d/s/c/g (~5.9k)
    module: sentier_importers.sources.foodex2.source
    target: sentier_vocab
    category: foodex2
    term_type: product
    fetch:
      url: "https://raw.githubusercontent.com/openefsa/efsa-catalogues/242ead56e40a29002a66d63fc64c6a497151af4b/ecf_catalogues/MTX.ecf"
      format: ecf
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: true                           # dedup against the other releases
    enabled: false

  - name: foodex2-organisms           # Biological source taxa, termType n (~23.9k)
    module: sentier_importers.sources.foodex2.source
    target: sentier_vocab
    category: foodex2
    term_type: organism
    fetch:
      url: "https://raw.githubusercontent.com/openefsa/efsa-catalogues/242ead56e40a29002a66d63fc64c6a497151af4b/ecf_catalogues/MTX.ecf"
      format: ecf
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  - name: foodex2-qualifiers          # Facet descriptors, termType f (~1.9k)
    module: sentier_importers.sources.foodex2.source
    target: sentier_vocab
    category: foodex2
    term_type: qualifier
    fetch:
      url: "https://raw.githubusercontent.com/openefsa/efsa-catalogues/242ead56e40a29002a66d63fc64c6a497151af4b/ecf_catalogues/MTX.ecf"
      format: ecf
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  # Bibliographic provenance for FoodEx2 — one Source record that every imported
  # product links to via its `source` slot. Static metadata, no fetch input.
  - name: foodex2-source
    module: sentier_importers.sources.foodex2.provenance
    target: sentier_vocab
    category: foodex2
    term_type: source
    fetch:
      url: "static://foodex2-source"  # unused: the plugin's fetch() returns no input
      format: json
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false                          # single static record; no Layer B
    enabled: false

  # Agribalyse adapter — CIQUAL products (ADEME Etalab open data). Nomenclature only
  # (codes, French names, food-group hierarchy); NO impact scores, NO LCI amounts.
  # ~2.5k terms (11 groups + 61 subgroups + ~2.45k products). Opt-in.
  - name: agribalyse-products
    module: sentier_importers.sources.agribalyse.products
    target: sentier_vocab
    category: agribalyse-3.2
    term_type: product
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/AGRIBALYSE3.2_reference_synthese_raw.parquet"
      format: parquet
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: true                           # dedup against the other releases (incl. FoodEx2)
    enabled: false

  # Bibliographic provenance for Agribalyse 3.2 — the Source every product links to.
  - name: agribalyse-source
    module: sentier_importers.sources.agribalyse.agribalyse_provenance
    target: sentier_vocab
    category: agribalyse-3.2
    term_type: source
    fetch:
      url: "static://agribalyse-source"  # unused: the plugin's fetch() returns no input
      format: json
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  # Agribalyse process catalog into sentier-vocab (process terms). Nomenclature only — the
  # LCI process name per CIQUAL product, linked to its product term via `related`. No
  # geography IRI, no exchanges (amounts are the licensed LCI). ~2.45k processes.
  - name: agribalyse-processes
    module: sentier_importers.sources.agribalyse.processes
    target: sentier_vocab
    category: agribalyse-3.2
    term_type: process
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/AGRIBALYSE3.2_reference_synthese_raw.parquet"
      format: parquet
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  # EF 3.1 descriptive terms in sentier-vocab (the ID authority). The method + its 25
  # impact categories as SKOS terms; the numeric CF *values* live in sentier-methods.
  - name: ef-lcia-method
    module: sentier_importers.sources.agribalyse.vocab_lcia_methods
    target: sentier_vocab
    category: ef-3.1
    term_type: lcia-method
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/EF-LCIAMethod_CF(EF-v3.1)__lciamethods_CF.parquet"
      format: parquet
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  - name: ef-impact-categories
    module: sentier_importers.sources.agribalyse.vocab_impact_categories
    target: sentier_vocab
    category: ef-3.1
    term_type: impact-category
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/EF-LCIAMethod_CF(EF-v3.1)__lciamethods_CF.parquet"
      format: parquet
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  # EF 3.1 LCIA layer into sentier-methods (the data repo). Two parquet slices over the
  # same JRC characterization-factor file: the methods table (one row per impact category)
  # and the CF table (one row per CF, keyed to the vocab flow IRIs). CF values are
  # JRC-public and uncapped; no ecoinvent involvement. Fills data/01-ef-3.1/.
  - name: methods
    module: sentier_importers.sources.agribalyse.methods
    target: sentier_methods
    category: 01-ef-3.1
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/EF-LCIAMethod_CF(EF-v3.1)__lciamethods_CF.parquet"
      format: parquet
    output_format: parquet
    enabled: false

  - name: characterization-factors
    module: sentier_importers.sources.agribalyse.cfs
    target: sentier_methods
    category: 01-ef-3.1
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/EF-LCIAMethod_CF(EF-v3.1)__lciamethods_CF.parquet"
      format: parquet
    # Named input: local arbiter for the 182 ambiguous global-duplicate (flow, method)
    # pairs the JRC table carries (see sources/agribalyse/ef_cf_dedup.py). A local
    # reference file only, never delivered; the import still runs if it is absent.
    inputs:
      simapro: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/simapro-EF31-adapted-cfs.parquet"
    output_format: parquet
    enabled: false

  # Agribalyse adapter — EF 3.1 harmonised elementary flows (license-free, JRC public).
  # Fetches the pinned release asset (see docs/plans/2026-07-10-agribalyse-elementary-flows-import.md
  # Task 0); nomenclature only, NO LCI amounts. Flows tagged "ecoinvent algorithm addition"
  # are excluded in transform(). ~79.3k flows; opt-in so it stays out of `run --all`.
  # Part of the ef-3.1 release with the method, its impact categories and the source
  # term; the compartment is an attribute of each flow term. The release exceeds the
  # vocab 3 MB guard, so `run --release ef-3.1` writes it as ef-3.1-01.parquet ….
  # The flow list's Brightway exact matches are not vocab relations: they belong to
  # sentier-mappings (pair ef-3.1__brightway).
  - name: ef31-elementary-flows
    module: sentier_importers.sources.agribalyse.flows
    target: sentier_vocab
    category: ef-3.1
    term_type: elementary-flow
    access: private
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-agribalyse/source/harmonised-flows-simple.json.gz"
      format: json-gz                                # unused: the plugin overrides parse() to gunzip
    output_format: parquet
    dedup:
      on_existing: skip                              # do not clobber curated flows/ENVO_* terms
      check_existing: true
    enabled: false

  # Bibliographic provenance for the EF 3.1 flow list — one Source record every flow
  # links to via its `source` slot. Static metadata, no fetch input.
  - name: agribalyse-ef31-source
    module: sentier_importers.sources.agribalyse.provenance
    target: sentier_vocab
    category: ef-3.1
    term_type: source
    fetch:
      url: "static://agribalyse-ef31-source"  # unused: the plugin's fetch() returns no input
      format: json
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false                          # single static record; no Layer B
    enabled: false

  # ---------------------------------------------------------------------------
  # BAFU-2026 v1 source family. All entries stay opt-in (`enabled: false`):
  # the fetch URL is a local file path (regenerate-locally pattern), so they
  # only run on a machine holding the freely downloadable EcoSpold v1 zip.
  # The BAFU §2.2 licence hold was lifted 2026-08-07 — data ships as normal
  # PRs (`--deliver`) or into a local clone (`--deliver-local`).
  # The vocab release is bafu-2026 (`run --release bafu-2026`): the source term,
  # the process terms and the elementary-flow terms, sector and compartment being
  # attributes or columns, never file names. Inventory files live in one folder
  # per source release (data/bafu-2026-v1/), sector being a column there (spec
  # 2026-10-12).
  # Citation: "Life Cycle Inventory database of the Swiss Federal
  # Administration, BAFU:2026".
  # ---------------------------------------------------------------------------
  # Bibliographic provenance record (a citation, not Data).
  - name: bafu-2026-source
    module: sentier_importers.sources.bafu.provenance
    target: sentier_vocab
    category: bafu-2026
    term_type: source
    fetch:
      url: "static://bafu-2026-source"  # unused: the plugin's fetch() returns no input
      format: json
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  # 11,947 BAFU process terms (incl. obsolete link targets).
  - name: bafu-vocab-processes
    module: sentier_importers.sources.bafu.vocab_processes
    target: sentier_vocab
    category: bafu-2026
    term_type: process
    access: licensed
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      format: zip
    output_format: parquet
    dedup:
      on_existing: skip
      check_existing: false
    enabled: false

  # 2,679 distinct BAFU biosphere flows; uuid5 ids shared with the inventory
  # exchanges. Unit is part of identity since 0.2.0, so Bq/kBq twins mint
  # separate ids; each flow carries its unit as a qudt:hasUnit relation
  # (sources/bafu/units.py). Four of the units are sentier-core terms, so the
  # sentier-core release must be in sentier-vocab before this one validates there.
  - name: bafu-vocab-flows
    module: sentier_importers.sources.bafu.vocab_flows
    target: sentier_vocab
    category: bafu-2026
    term_type: elementary-flow
    access: licensed
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      format: zip
    output_format: parquet
    dedup:
      on_existing: skip                              # never clobber EF 3.1/ENVO terms
      check_existing: true
    enabled: false

  # Full inventory, one processes/exchanges pair in the source folder
  # data/bafu-2026-v1/ (category = <source>-<source_version>, one folder per
  # published release). Every dataset is emitted; its sector is the `sector`
  # column on processes.parquet (map in sources/bafu/ecospold.py). A delivery
  # replaces the folder whole; sources never share a folder. emit_filename
  # gives the contract file names.

  - name: bafu-processes
    module: sentier_importers.sources.bafu.inventory_processes
    target: sentier_inventory
    category: bafu-2026-v1
    access: licensed
    emit_filename: processes
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      format: zip
    output_format: parquet
    enabled: false

  - name: bafu-exchanges
    module: sentier_importers.sources.bafu.inventory_exchanges
    target: sentier_inventory
    category: bafu-2026-v1
    access: licensed
    emit_filename: exchanges
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      format: zip
    output_format: parquet
    enabled: false

  # sentier-mappings: BAFU-2026 v1 elementary flows → EF 3.1 CF keys.
  # De-bridged from dds-carbonminds-data, whose bridge targets ecoinvent for
  # 98.7% of matched flows; each entry here names the EF flow carrying the
  # identical factor, so no ecoinvent identifier reaches this public repo.
  # Spec: docs/specs/2026-08-06-bafu-ef-debridged-mappings.md.
  # enabled: false — the source side is BAFU flow names, so the payload is held
  # under the same regenerate-locally licence gate as the other bafu-* sources
  # (2026-08-01 spec §3) until a BAFU ToU §2.2 consent lands.
  - name: bafu-ef-biosphere          # unique source name; emits biosphere-1-curated.json
    module: sentier_importers.sources.bafu.mappings_biosphere
    target: sentier_mappings
    category: bafu-2026-v1__ef-3.1
    access: private
    emit_filename: biosphere-1-curated
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/dds-carbonminds-data/registry/mappings_biosphere_ef.parquet"
      format: parquet
    output_format: json
    package:
      name: bafu-2026-v1__ef-3.1-biosphere
      version: 0.2.0
      verb: replace
    enabled: false

  # sentier-mappings: bafu-2026-v1 → EF 3.1 CF keys INFERRED from Eaternity's
  # ecoinvent-biosphere3 → eaternity-bafu-ext pair family (PR #7). Each Eaternity
  # target is placed at BAFU sub-compartment level via the retained biosphere3 context
  # (sources/eaternity/bridge.py, strict, never a fallback), and its biosphere3 partner
  # is resolved to the EF flow carrying the identical CF vector (cf_identity.py, same
  # de-bridging argument as the curated package). Only flows the curated payload lacks
  # are emitted, so the curated package keeps precedence by construction.
  # Regenerate-locally: every input is a local path (the method_cfs input is a
  # DIRECTORY read outside the fetch cache). Run with a fresh --cache-dir: file://
  # inputs are cached by URL and go stale when upstream moves.
  - name: eaternity-inferred-bafu-ef-biosphere   # emits biosphere-2-inferred.json
    module: sentier_importers.sources.eaternity.mappings_biosphere
    target: sentier_mappings
    category: bafu-2026-v1__ef-3.1
    access: private
    emit_filename: biosphere-2-inferred
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/ecoinvent-biosphere3__eaternity-bafu-ext/biosphere.json"
      format: json
    inputs:
      curated: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/bafu-2026-v1__ef-3.1/biosphere-1-curated.json"
      ecospold: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      ef_flows: "file://${SENTIER_DATA_ROOT}/sentier-methods/data/01-ef-3.1/characterization-factors.parquet"
      method_cfs: "file://${SENTIER_DATA_ROOT}/dds-carbonminds-data/registry/method_cfs"
    output_format: json
    package:
      name: bafu-2026-v1__ef-3.1-biosphere-inferred
      version: 0.1.1
      verb: replace
    enabled: false

  # Same computation, emits the withheld pairs as the non-normative inference_review.json
  # sidecar (verb `review`, the shape of the other *_review.json sidecars; invisible to
  # the sentier-mappings CI validator by design).
  - name: eaternity-inferred-bafu-ef-review      # emits inference_review.json
    module: sentier_importers.sources.eaternity.inference_review
    target: sentier_mappings
    category: bafu-2026-v1__ef-3.1
    access: private
    emit_filename: inference_review
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/ecoinvent-biosphere3__eaternity-bafu-ext/biosphere.json"
      format: json
    inputs:
      curated: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/bafu-2026-v1__ef-3.1/biosphere-1-curated.json"
      ecospold: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      ef_flows: "file://${SENTIER_DATA_ROOT}/sentier-methods/data/01-ef-3.1/characterization-factors.parquet"
      method_cfs: "file://${SENTIER_DATA_ROOT}/dds-carbonminds-data/registry/method_cfs"
    output_format: json
    package:
      name: bafu-2026-v1__ef-3.1-inference-review
      version: 0.1.1
      verb: review
    enabled: false

  # sentier-mappings: bafu-2026-v1 → EF 3.1 by PUBLIC matching (name, land-use class,
  # ore composite, synonym, qualifier spelling, curated alias, the same on the region-stripped
  # name, CAS last)
  # against sentier-methods' CF table + sentier-vocab's EF 3.1 flow terms, for flows neither the
  # curated nor the inferred package maps. Strict sub-compartment placement with an
  # explicit, commented `unspecified` fallback. Plan: dds wiki
  # 2026-09-12-bafu-ef-remaining-flows. Regenerate-locally with a fresh --cache-dir.
  - name: bafu-ef-biosphere-matched            # emits biosphere-3-matched.json
    module: sentier_importers.sources.bafu.mappings_biosphere_matched
    target: sentier_mappings
    category: bafu-2026-v1__ef-3.1
    access: licensed
    emit_filename: biosphere-3-matched
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      format: zip
    inputs:
      curated: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/bafu-2026-v1__ef-3.1/biosphere-1-curated.json"
      inferred: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/bafu-2026-v1__ef-3.1/biosphere-2-inferred.json"
      ef_cfs: "file://${SENTIER_DATA_ROOT}/sentier-methods/data/01-ef-3.1/characterization-factors.parquet"
      ef_vocab: "file://${SENTIER_DATA_ROOT}/sentier-vocab/terms"
    output_format: json
    package:
      name: bafu-2026-v1__ef-3.1-biosphere-matched
      version: 0.1.0
      verb: replace
    enabled: false

  # Same inputs and computation, emits the non-normative coverage.json sidecar: one row per
  # bafu-2026-v1 flow, mapped (package biosphere-1-curated/biosphere-2-inferred/
  # biosphere-3-matched/biosphere-4-nomenclature, tier -- name, land-use class, ore composite,
  # synonym, qualifier spelling, curated alias, the same on the region-stripped name, CAS last
  # -- and placement)
  # or unmapped (reason, detail); rows of substances with conflicting source CAS values carry
  # `cas_conflict`. Reports the matched and nomenclature packages via its own two-pass
  # computation (the characterised-only index for the matched package, the inclusive index
  # for the nomenclature package, over what the matched package leaves uncovered) so it never
  # needs the matched payload as an input. Verb `coverage` (the shape of the other
  # *_review.json sidecars; invisible to sentier-mappings CI by design).
  - name: bafu-ef-coverage                     # emits coverage.json
    module: sentier_importers.sources.bafu.mappings_biosphere_coverage
    target: sentier_mappings
    category: bafu-2026-v1__ef-3.1
    access: licensed
    emit_filename: coverage
    fetch:
      url: "file://${SENTIER_DATA_ROOT}/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
      format: zip
    inputs:
      curated: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/bafu-2026-v1__ef-3.1/biosphere-1-curated.json"
      inferred: "file://${SENTIER_DATA_ROOT}/sentier-mappings/data/bafu-2026-v1__ef-3.1/biosphere-2-inferred.json"
      ef_cfs: "file://${SENTIER_DATA_ROOT}/sentier-methods/data/01-ef-3.1/characterization-factors.parquet"
      ef_vocab: "file://${SENTIER_DATA_ROOT}/sentier-vocab/terms"
    output_format: json
    package:
      name: bafu-2026-v1__ef-3.1-coverage
      version: 0.1.0
      verb: coverage
    enabled: false

  # sentier-mappings: NOMENCLATURE alignment for BAFU flows whose EF 3.1 counterpart exists in
  # sentier-vocab but carries no factor in any EF 3.1 method (impact zero by construction). Same
  # matching as the matched package on the index that includes uncharacterised EF flows (placed
  # via the Brightway context crosswalk, matching/bw_context.py), run only over the flows the
  # curated, inferred and matched packages leave uncovered. Every entry says so in its comment.
  # Decision 2026-09-13. Regenerate-locally with a fresh --cache-dir, AFTER
