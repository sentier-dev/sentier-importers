      url: "file:///home/laurenz/dds/sentier-mappings/data/ecoinvent-biosphere3__eaternity-bafu-ext/biosphere.json"
      format: json
    inputs:
      curated: "file:///home/laurenz/dds/sentier-mappings/data/bafu-2026-v1__ef-3.1/biosphere-1-curated.json"
      ecospold: "file:///home/laurenz/dds/sources/bafu-2026/BAFU-2026 v1_ecoSpold v1.zip"
