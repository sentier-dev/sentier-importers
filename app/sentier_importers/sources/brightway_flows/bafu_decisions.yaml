# Decisions on Brightway Flows 1.1.0 links for bafu-2026-v1 -> ef-3.1 that change a score.
# Laurenz 2026-11-19: "pick the best values (correctness)". One entry per BAFU flow code.
# decision: theirs (take the Brightway Flows target), ours (keep our target), hold (no entry).
groups:
  air_unspecified:
    decision: theirs
    reason: "the source is an emission to air, unspecified; our target sat on another air compartment, theirs is the same substance on 'Emissions to air, unspecified'"
  sea_water:
    decision: theirs
    reason: "the source is an emission to the ocean; our target was the fresh water flow, theirs is the sea water flow"
  vanadium:
    decision: theirs
    reason: "BAFU names the element; our target was the vanadium (V) species, theirs is the EF flow 'vanadium'"
  specific_substance:
    decision: theirs
    reason: "theirs is the EF flow of the substance itself; ours was a group flow ('herbicides, unspecified')"
  soil_agricultural:
    decision: theirs
    reason: "the source is an emission to agricultural soil; our target sat on non-agricultural soil"
  water_unspecified:
    decision: theirs
    reason: "the source is an emission to water, unspecified; our target sat on fresh water"
  retired_ef_flow:
    decision: theirs
    reason: "our target is an EF flow that Brightway Flows 1.1.0 records as merged into theirs; theirs is the live flow"
  land_mosaic:
    decision: theirs
    reason: "'heterogeneous, agricultural' is the EF land class 'agriculture, mosaic', not 'arable'"
  same_substance_new:
    decision: theirs
    reason: "same substance (CAS 71-55-6) on the matching air compartment; we had withheld it as ambiguous"
  element_not_ion:
    decision: ours
    reason: "BAFU names the element; theirs is the aluminium(3+) ion flow"
  jrc_uncharacterised:
    decision: ours
    reason: "theirs is the EF flow of the same name but JRC gives it no factor, while the ecoinvent and GreenDelta EF implementations and the Brightway Flows consensus apply the factor our target carries; sentier-methods holds JRC factors only"
  industrial_soil:
    decision: ours
    reason: "theirs sits on 'Other emissions to industrial soil', which JRC does not characterise; industrial soil is non-agricultural soil and the other implementations apply the same factors there"
  wrong_substance:
    decision: ours
    reason: "theirs is dinitrogen (N2); BAFU 'Nitrogen' to water is nitrogen as a nutrient"
  accounting_flow:
    decision: hold
    reason: "'Water, embodied in product' is a BAFU 'economic issues' flow, not an exchange with the environment; mapping it onto a water resource would add water-use scores"
