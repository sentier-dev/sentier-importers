# Curated BAFU-2026 v1 flow name -> EF 3.1 preferred label. Lowercase keys.
# Only for spellings no generic rule recovers; a wrong alias is a wrong factor,
# so every line is checked against sentier-vocab's EF pref_label by hand.
# A key whose BAFU flows can never place on the target's EF context is dead and
# must be removed, not kept.
#
# Round 6, decision 2026-09-14: a target string is checked against the EF flow's
# vocab pref_label first (the traditional convention every existing line here was
# curated against) and its CF-table JRC spelling second, both case-insensitively --
# AliasMatcher itself tries the JRC name first at runtime (matching.ef_index's own
# naming authority), falling back to the vocab pref_label only when that finds
# nothing, and only when it can do so unambiguously (see AliasMatcher's own
# docstring). A target that matches neither is dead, same as always.
aliases:
  particulates, < 2.5 um: Particles (PM2.5)
  particulates, < 10 um:
    target: Particles (PM10)
    caveat: >-
      BAFU PM10 includes the fine fraction; characterised at EF's PM10 factor
      (4.35x lower than PM2.5)
  particulates, < 10 um (stationary):
    target: Particles (PM10)
    caveat: >-
      BAFU PM10 includes the fine fraction; characterised at EF's PM10 factor
      (4.35x lower than PM2.5)
  particulates, > 2.5 um, and < 10um:
    target: Particles (PM10)
    caveat: >-
      coarse fraction (2.5 to 10 um) characterised at EF's PM10 factor, the curated
      package's convention (decision 2026-09-14)
  nmvoc, non-methane volatile organic compounds, unspecified origin: Non-methane Volatile Organic Compounds
  dioxin, 2,3,7,8 tetrachlorodibenzo-p-: 2,3,7,8-tetrachlorodibenzo-p-dioxin
  ammonium, ion: Ammonium
  curium alpha: Curium
  plutonium-alpha: Plutonium
  # water resources (m3) -> EF water-use resource flows
  water, river: River water
  water, lake: Lake water
  water, well: Ground water
  water, unspecified natural origin/m3: Water
  water, unspecified natural origin: Water
  water, cooling, unspecified natural origin/m3: Water to Cooling
  water, cooling, unspecified natural origin: Water to Cooling
  water, turbine use, unspecified natural origin: Water to turbine
  water, process, unspecified natural origin/m3: Water
  # its /kg twin: without this alias the three "resources / unspecified|land|in
  # ground" rows land on one EF leaf (renewable material resources from water) but
  # spread across three distinct EF flows (Ground Water / Water / Water to Cooling)
  # with different factors -- ambiguous_substances. "Water" is the only defensible
  # generic target; the kg -> m3 water-density conversion then applies as usual.
  water, process, unspecified natural origin/kg: Water
  # surface water is river/lake water, not EF's unspecified-origin "Water"
  water, process, surface: River water
  # fossil/biotic energy resources (MJ) -> EF resource-use-fossils flows (megajoule)
  energy, from coal: Hard Coal
  energy, from coal, brown: Brown Coal
  # "Energy, from oil" is filed under resources / unspecified (uninformative, decision
  # (b)); with exactly one EF leaf reachable via this alias, it resolves through the
  # resource-branch fallback onto Crude Oil, carrying that fallback's own caveat.
  energy, from oil: Crude Oil
  energy, from peat: Peat
  energy, from uranium: Uranium
  butane, perfluorocyclo-, pfc-318: PFC-318
  ethane, 1,1,2-trifluoro-, hfc-143: HFC-143
  octene (mixture of isomers): Octene
  # fossil groundwater: taken as groundwater (decision 2026-09-13); "Water, fossil" is
  # withdrawn from _NON_FRESHWATER accordingly (see mappings_biosphere_matched.py) so
  # this alias actually gets a chance to fire.
  water, fossil:
    target: Ground Water
    caveat: >-
      fossil water taken as groundwater (decision 2026-09-13; EF files all water
      resources under renewable material resources from water)
  # "Nitrogen, Total (excluding N2)" asserts a chemical identity (total N), not a
  # spelling difference; taken as BAFU's "Nitrogen" to water by decision 2026-09-13.
  nitrogen:
    target: "Nitrogen, Total (excluding N2)"
    caveat: "BAFU 'Nitrogen' emitted to water taken as total nitrogen (decision 2026-09-13)"
  coal, brown: Brown Coal
  coal, hard: Hard Coal
  oil, crude: Crude Oil
  1-butanol: Butanol
  azadirachtin a+b: Azadirachtin
  benzo(g,h,i)perylene: Benzo(ghi)perylene
  propylene glycol methyl ether acetate: Propylene Glycol Monomethyl Ether Acetate
  # the three oxygen-demand targets exist in EF 3.1 but carry no factor: they only take
  # effect once the nomenclature bridge (phase 2, task 4) is in place; kept deliberately
  bod5, biological oxygen demand: Biological Oxygen Demand
  cod, chemical oxygen demand: Chemical Oxygen Demand
  toc, total organic carbon: Total Organic Carbon
  # decision (f)(3), 2026-09-13: standing wood ("Wood" carries no EF 3.1 factor, so
  # every wood alias fires only on the nomenclature package) and two more water
  # spellings onto EF's "Water" ("water/m3" is an air-bucket emission onto the
  # uncharacterised air "Water" flow, nomenclature package too). "Water, unspecified"
  # yields no entry today -- no BAFU flow
  # currently carries that exact name -- kept anyway.
  wood, soft, standing: Wood
  wood, hard, standing: Wood
  wood, primary forest, standing: Wood
  wood, unspecified, standing/kg: Wood
  wood, unspecified, standing/m3: Wood
  water/m3: Water
  water, unspecified: Water
  # round 4: plain spelling differences (no caveat) that no generic tier recovers.
  propane, 1,1,1,3,3-pentafluoro-, hfc-245fa: 1,1,1,3,3-pentafluoropropane
  chlorosilane, trimethyl-: Chlorotrimethylsilane
  toluene, 2-chloro-: O-chlorotoluene
  thiazole, 2-(thiocyanatemethylthio)benzo-: 2-(Thiocyanomethylthio)benzothiazole
  disodium acid methane arsenate: Disodium Methylarsonate
  # replaces the earlier "benzo[a]anthracene" (square brackets) target, which does not
  # exist in EF 3.1 at all and so never fired; "BENZ(a)ANTHRACENE" is EF's real
  # pref_label and is characterised (fires from the matched package, not just the
  # nomenclature package).
  benzo(a)anthracene: BENZ(a)ANTHRACENE
  heat, waste: Waste Heat
  particulates, > 10 um: Particles (> PM10)
  energy, from hydro power: Primary Energy From Hydro Power
  # round 4: spellings that also assert a decision, so each carries its own caveat.
  chlormequat:
    target: Chlormequat Chloride
    caveat: commercial chloride form of the same active ingredient (decision 2026-09-13)
  primisulfuron:
    target: Primisulfuron-methyl
    caveat: methyl ester is the active ingredient as sold (decision 2026-09-13)
  tributylstannane:
    target: Tributyltin
    caveat: >-
      tributyltin hydride taken as the tributyltin cation (decision 2026-09-13)
  benzene (as btex):
    target: Benzene
    caveat: BTEX reported as benzene taken as benzene (decision 2026-09-13)
  # round 4: the ore-composite-shaped TiO2 names OreCompositeMatcher does not
  # decompose (a compound, not a bare element -- see matchers.py); the stoichiometric
  # factor from the amount of TiO2 to the amount of titanium lives in
  # ef_units.STOICHIOMETRIC, applied by conversion_for, not as a caveat here.
  tio2, 54% in ilmenite, 2.6% in crude ore: Titanium
  tio2, 95% in rutile, 0.40% in crude ore: Titanium
  # round 4: BAFU land flows whose class has no EF equivalent at all; the nearest EF
  # land-use class is used instead. All four are filed by BAFU under resources / land
  # in the real ecoSpold data and place EXACT there. The EF targets are factorless
  # land flows, so every one of these four fires only on the nomenclature package.
  occupation, water courses, artificial:
    target: Inland Water Bodies
    caveat: nearest EF land-use class (decision 2026-09-13)
  transformation, to water courses, artificial:
    target: To Inland Water Bodies
    caveat: nearest EF land-use class (decision 2026-09-13)
  transformation, from sea and ocean:
    target: From Seabed
    caveat: nearest EF land-use class (decision 2026-09-13)
  transformation, to sea and ocean:
    target: To Seabed
    caveat: nearest EF land-use class (decision 2026-09-13)
