id: https://example.org/product
name: product
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
default_range: string
imports:
  - linkml:types
classes:
  ProductCollection:
    tree_root: true
    attributes:
      scheme:
        required: true
      products:
        multivalued: true
        inlined_as_list: true
        range: Product
  Product:
    attributes:
      iri:
        identifier: true
        required: true
      pref_label:
        required: true
      definition:
        required: false
