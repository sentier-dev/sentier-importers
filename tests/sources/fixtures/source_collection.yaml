id: https://example.org/source
name: source
description: Flattened stand-in for sentier_vocab's source schema, for offline validation.
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
default_range: string
imports:
  - linkml:types
classes:
  SourceCollection:
    tree_root: true
    attributes:
      scheme:
        required: true
        range: uriorcurie
      sources:
        multivalued: true
        inlined_as_list: true
        range: Source
  Source:
    attributes:
      iri:
        identifier: true
        required: true
        range: uriorcurie
      pref_label:
        required: true
      title:
      creators:
        multivalued: true
      date:
        range: date
      publisher:
      identifier:
      citation:
      status:
